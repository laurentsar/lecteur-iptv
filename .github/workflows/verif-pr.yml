name: Vérification des PR

# Avant la fusion, sans construire ni publier d'APK : les tests de
# l'interface, et la compilation du Java que les patches ajoutent à l'APK
# (ci/verif_java.py). Une erreur Java ne se voyait sinon qu'au build qui
# suit la fusion — la version partait alors en échec.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # javac est fourni par l'image ubuntu-latest (JDK 17).
      - run: python3 ci/verif_java.py "$RUNNER_TEMP/verif-java"
