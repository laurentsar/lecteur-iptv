name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# La chaîne de build est mutualisée avec les autres applications Capacitor
# (laurentsar/app-kit) : seules les particularités de cette app restent ici.
# NDK/CMake pour l'extension FFmpeg (décodage AC3/E-AC3/DTS/TrueHD), Pillow
# pour les icônes et la bannière TV, et la liste ordonnée des patches — l'ordre
# compte, patch_signing.py doit passer avant que Gradle lise sa configuration.
jobs:
  # L'interface est vérifiée dans jsdom AVANT de produire une APK : une
  # release verte mais dont l'écran reste vide coûte bien plus cher qu'un
  # build refusé (elle part sur les téléviseurs, où le diagnostic est pénible).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # npm ci, pas npm install : installe exactement ce que package-lock.json
      # décrit, et échoue si le verrou et package.json divergent — sur un dépôt
      # public, c'est aussi ce qui empêche une dépendance de changer sous nos
      # pieds d'un build à l'autre.
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    needs: test
    # Un workflow appelé ne peut pas s'octroyer plus de droits que son
    # appelant : sans ce bloc, la publication de la release échoue au parsing
    # (« nested job is requesting contents: write, but is only allowed
    # contents: read »), car le jeton par défaut du dépôt est en lecture seule.
    permissions:
      contents: write
    # Épinglé au commit précis plutôt qu'à un tag : le correctif du SDK
    # Android (paquet 'tools' disparu, voir app-kit) est poussé sur main
    # mais le tag v2 n'a pas pu être créé depuis cette session (403 GitHub,
    # vraisemblablement une règle de protection des tags) — à remplacer par
    # @v2 une fois ce tag créé (README d'app-kit : v1 reste immuable, tout
    # changement de comportement se publie en v2).
    uses: laurentsar/app-kit/.github/workflows/build-apk.yml@57a5df8c62ecbd78c1ae89849c4398c0b7a2b408
    with:
      apk_name: lecteur-iptv
      release_name: Lecteur IPTV
      regen_android: true
      ndk: true
      pillow: true
      ci_scripts: >-
        ci/patch_signing.py
        ci/patch_manifest.py
        ci/patch_config_intent.py
        ci/patch_native_player.py
        ci/patch_recorder.py
        ci/patch_radio_background.py
        ci/patch_keep_awake.py
        ci/patch_updater.py
        ci/patch_tv_keys.py
        ci/patch_tv_focus.py
        ci/patch_abi.py
        ci/set_version.py
        ci/set_icons.py
    secrets: inherit
